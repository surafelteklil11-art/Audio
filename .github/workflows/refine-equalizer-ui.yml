name: Refine Equalizer UI

on:
  push:
    paths:
      - '.github/workflows/refine-equalizer-ui.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI refinement
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/com/surafel/audio/EqualizerActivity.kt')
          s = p.read_text()

          replacements = {
              'window.statusBarColor = Color.rgb(4, 16, 43)': 'window.statusBarColor = Color.rgb(6, 18, 42)',
              'window.navigationBarColor = Color.rgb(6, 14, 31)': 'window.navigationBarColor = Color.rgb(7, 17, 37)',
              'setBackgroundColor(Color.rgb(7, 17, 37))': 'setBackgroundColor(Color.rgb(7, 20, 45))',
              'LinearLayout.LayoutParams(-1, dp(76))': 'LinearLayout.LayoutParams(-1, dp(72))',
              'setPadding(dp(16), dp(12), dp(16), dp(28))': 'setPadding(dp(16), dp(10), dp(16), dp(24))',
              'intArrayOf(Color.rgb(36, 103, 160), Color.rgb(74, 93, 187))': 'intArrayOf(Color.rgb(42, 101, 181), Color.rgb(83, 91, 191))',
              'dp(24).toFloat()': 'dp(18).toFloat()',
              'textSize = 40f': 'textSize = 34f',
              'textSize = 23f': 'textSize = 22f',
              'LinearLayout.LayoutParams(dp(78), dp(48))': 'LinearLayout.LayoutParams(dp(76), dp(44))',
              'textSize = 16f': 'textSize = 17f',
              'setPadding(dp(14), dp(10), dp(14), dp(14))': 'setPadding(dp(14), dp(9), dp(14), dp(12))',
              'Color.rgb(9, 20, 42)': 'Color.rgb(10, 26, 56)',
              'Color.rgb(42, 61, 91)': 'Color.rgb(42, 65, 104)',
              'LinearLayout.LayoutParams(-1, dp(350))': 'LinearLayout.LayoutParams(-1, dp(340))',
              'LinearLayout.LayoutParams(0, dp(350), 1f)': 'LinearLayout.LayoutParams(0, dp(340), 1f)',
              'LinearLayout.LayoutParams(-1, dp(54)).apply': 'LinearLayout.LayoutParams(-1, dp(52)).apply',
              'addView(reverbValue, LinearLayout.LayoutParams(-1, dp(58)))': 'addView(reverbValue, LinearLayout.LayoutParams(-1, dp(60)))',
              'target.addView(knob, LinearLayout.LayoutParams(0, dp(225), 1f))': 'target.addView(knob, LinearLayout.LayoutParams(0, dp(210), 1f))',
              'addView(grid, LinearLayout.LayoutParams(-1, dp(450)))': 'addView(grid, LinearLayout.LayoutParams(-1, dp(420)))',
              'val desiredWidth = dp(146)': 'val desiredWidth = dp(160)',
              'val desiredHeight = dp(52)': 'val desiredHeight = dp(50)',
              'cornerRadius = dp(13).toFloat()': 'cornerRadius = dp(14).toFloat()',
              'if (selected) {\n                    intArrayOf(Color.rgb(58, 112, 194), Color.rgb(45, 75, 139))\n                } else {\n                    intArrayOf(Color.rgb(18, 34, 60), Color.rgb(15, 28, 51))\n                }': 'if (selected) {\n                    intArrayOf(Color.rgb(60, 112, 194), Color.rgb(52, 82, 151))\n                } else {\n                    intArrayOf(Color.rgb(20, 40, 72), Color.rgb(16, 33, 60))\n                }',
              'setStroke(dp(1), if (selected) Color.rgb(77, 127, 205) else Color.rgb(26, 42, 67))': 'setStroke(dp(1), if (selected) Color.rgb(91, 145, 224) else Color.rgb(38, 61, 96))',
          }

          for old, new in replacements.items():
              if old not in s:
                  print(f'warning: pattern not found: {old[:70]}')
              s = s.replace(old, new)

          # The Equalizer is inside a vertical ScrollView. Without explicitly
          # locking interception, the parent consumes the same vertical drag
          # used to change a band and the whole page jumps while dragging.
          old_band = '''        override fun onTouchEvent(event: MotionEvent): Boolean {\n            val top = dp(45).toFloat()\n            val bottom = height - dp(48)\n            when (event.action) {\n                MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {\n                    val ratio = ((bottom - event.y) / (bottom - top)).coerceIn(0f, 1f)\n                    value = ratio * 30f - 15f\n                    applyBand(index, frequency, value)\n                    invalidate()\n                    return true\n                }\n                MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {\n                    performClick()\n                    return true\n                }\n            }\n            return true\n        }'''
          new_band = '''        override fun onTouchEvent(event: MotionEvent): Boolean {\n            val top = dp(45).toFloat()\n            val bottom = height - dp(48)\n            when (event.actionMasked) {\n                MotionEvent.ACTION_DOWN -> {\n                    parent?.requestDisallowInterceptTouchEvent(true)\n                    val ratio = ((bottom - event.y) / (bottom - top)).coerceIn(0f, 1f)\n                    value = ratio * 30f - 15f\n                    applyBand(index, frequency, value)\n                    invalidate()\n                    return true\n                }\n                MotionEvent.ACTION_MOVE -> {\n                    parent?.requestDisallowInterceptTouchEvent(true)\n                    val ratio = ((bottom - event.y) / (bottom - top)).coerceIn(0f, 1f)\n                    value = ratio * 30f - 15f\n                    applyBand(index, frequency, value)\n                    invalidate()\n                    return true\n                }\n                MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {\n                    parent?.requestDisallowInterceptTouchEvent(false)\n                    performClick()\n                    return true\n                }\n            }\n            return true\n        }'''
          if old_band not in s:
              raise SystemExit('BandSliderView touch block not found; refusing unsafe edit')
          s = s.replace(old_band, new_band)

          old_knob = '''        override fun onTouchEvent(event: MotionEvent): Boolean {\n            when (event.action) {\n                MotionEvent.ACTION_DOWN -> {\n                    lastY = event.y\n                    return true\n                }\n                MotionEvent.ACTION_MOVE -> {\n                    val dy = lastY - event.y\n                    value = (value + dy / dp(170)).coerceIn(0f, 1f)\n                    lastY = event.y\n                    changed(value)\n                    invalidate()\n                    return true\n                }\n                MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {\n                    performClick()\n                    return true\n                }\n            }\n            return true\n        }'''
          new_knob = '''        override fun onTouchEvent(event: MotionEvent): Boolean {\n            when (event.actionMasked) {\n                MotionEvent.ACTION_DOWN -> {\n                    parent?.requestDisallowInterceptTouchEvent(true)\n                    lastY = event.y\n                    return true\n                }\n                MotionEvent.ACTION_MOVE -> {\n                    parent?.requestDisallowInterceptTouchEvent(true)\n                    val dy = lastY - event.y\n                    value = (value + dy / dp(170)).coerceIn(0f, 1f)\n                    lastY = event.y\n                    changed(value)\n                    invalidate()\n                    return true\n                }\n                MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {\n                    parent?.requestDisallowInterceptTouchEvent(false)\n                    performClick()\n                    return true\n                }\n            }\n            return true\n        }'''
          if old_knob not in s:
              raise SystemExit('KnobView touch block not found; refusing unsafe edit')
          s = s.replace(old_knob, new_knob)

          p.write_text(s)

      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          git commit -m 'fix: refine equalizer sizing colors geometry and touch'
          git push

      - name: Remove one-shot patch workflow
        if: success()
        run: |
          git rm .github/workflows/refine-equalizer-ui.yml
          git commit -m 'chore: remove one-shot equalizer refinement workflow'
          git push
