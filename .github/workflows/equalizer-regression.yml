name: Audio UI regression tests

on:
  push:
    branches: [main, fix/equalizer-launch-crash]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test Audio UI and build the checked-out source
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equalizer-test-results-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/theme-previews/
            app/build/calendar-previews/
            app/build/fingerprint-previews/
            app/build/checkers-previews/
            app/build/pdf-previews/
          if-no-files-found: warn
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-verified-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  native-pdf:
    name: Native PDF (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test PDFs on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            adb pull /sdcard/Android/data/com.surafel.audio/files/pdf-previews app/build/pdf-device-previews
      - name: Upload native PDF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-pdf-api-${{ matrix.api }}-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/pdf-device-previews/
          if-no-files-found: warn
