name: Repair Equalizer and Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Equalizer source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          echo "Equalizer source is present."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Clean
        run: gradle clean --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --rerun-tasks --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-equalizer-manual-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
