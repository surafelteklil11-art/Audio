name: Build Audio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply true fullscreen video player fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/surafel/audio/MainActivity.kt')
          text = main.read_text()
          if 'import android.content.Intent' not in text:
              text = text.replace('import android.content.Context\n', 'import android.content.Context\nimport android.content.Intent\n', 1)

          if 'startActivity(\n            Intent(this, FullscreenVideoActivity::class.java)' not in text:
              pattern = r'    private fun playVideo\(entry: VideoEntry\) \{.*?\n    \}\n\n    private fun enterFullscreenVideo\(\) \{'
              replacement = '''    private fun playVideo(entry: VideoEntry) {
        if (!hasVideoPermission()) return
        startActivity(
            Intent(this, FullscreenVideoActivity::class.java)
                .putExtra(FullscreenVideoActivity.EXTRA_VIDEO_URI, entry.uri.toString())
                .putExtra(FullscreenVideoActivity.EXTRA_VIDEO_TITLE, entry.title)
        )
    }

    private fun enterFullscreenVideo() {'''
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('playVideo block not found; refusing partial patch')
              main.write_text(text)

          activity = Path('app/src/main/java/com/surafel/audio/FullscreenVideoActivity.kt')
          if not activity.exists():
              activity.write_text(r'''package com.surafel.audio

import android.graphics.Color
import android.media.MediaPlayer
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.view.Gravity
import android.view.WindowManager
import android.widget.FrameLayout
import android.widget.TextView
import android.widget.VideoView
import androidx.appcompat.app.AppCompatActivity
import androidx.core.view.WindowCompat
import androidx.core.view.WindowInsetsCompat
import androidx.core.view.WindowInsetsControllerCompat

class FullscreenVideoActivity : AppCompatActivity() {
    companion object {
        const val EXTRA_VIDEO_URI = "video_uri"
        const val EXTRA_VIDEO_TITLE = "video_title"
    }

    private lateinit var video: VideoView
    private lateinit var pauseButton: TextView
    private lateinit var speedButton: TextView
    private var preparedPlayer: MediaPlayer? = null
    private var speed = 1.0f

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
        WindowCompat.setDecorFitsSystemWindows(window, false)
        hideSystemBars()

        val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
        video = VideoView(this)
        root.addView(video, FrameLayout.LayoutParams(-1, -1))

        val title = TextView(this).apply {
            text = intent.getStringExtra(EXTRA_VIDEO_TITLE) ?: "Video"
            textSize = 16f
            setTextColor(Color.WHITE)
            setPadding(20, 12, 20, 12)
            setBackgroundColor(Color.argb(150, 0, 0, 0))
            maxLines = 1
        }
        root.addView(title, FrameLayout.LayoutParams(-1, -2, Gravity.TOP))

        val close = TextView(this).apply {
            text = "✕"
            textSize = 24f
            gravity = Gravity.CENTER
            setTextColor(Color.WHITE)
            setBackgroundColor(Color.argb(150, 0, 0, 0))
            contentDescription = "Close video"
            setOnClickListener { finish() }
        }
        root.addView(close, FrameLayout.LayoutParams(56, 56, Gravity.TOP or Gravity.END).apply { topMargin = 12; rightMargin = 12 })

        val controls = FrameLayout(this).apply { setBackgroundColor(Color.argb(165, 0, 0, 0)) }
        val back = control("↶ 10s") { video.seekTo((video.currentPosition - 10_000).coerceAtLeast(0)) }
        controls.addView(back, FrameLayout.LayoutParams(90, 56, Gravity.START or Gravity.CENTER_VERTICAL).apply { leftMargin = 8 })
        pauseButton = control("▶") { if (video.isPlaying) video.pause() else video.start(); updatePause() }
        controls.addView(pauseButton, FrameLayout.LayoutParams(64, 56, Gravity.CENTER))
        val forward = control("30s ↷") {
            val duration = video.duration.coerceAtLeast(0)
            video.seekTo((video.currentPosition + 30_000).coerceAtMost(duration))
        }
        controls.addView(forward, FrameLayout.LayoutParams(90, 56, Gravity.END or Gravity.CENTER_VERTICAL).apply { rightMargin = 72 })
        speedButton = control("1.0×") { cycleSpeed() }
        controls.addView(speedButton, FrameLayout.LayoutParams(68, 56, Gravity.END or Gravity.CENTER_VERTICAL).apply { rightMargin = 4 })
        root.addView(controls, FrameLayout.LayoutParams(-1, 64, Gravity.BOTTOM))
        setContentView(root)

        val controller = android.widget.MediaController(this)
        controller.setAnchorView(video)
        video.setMediaController(controller)
        video.setVideoURI(Uri.parse(intent.getStringExtra(EXTRA_VIDEO_URI)))
        video.setOnPreparedListener { player ->
            preparedPlayer = player
            player.isLooping = false
            applySpeed()
            video.start()
            updatePause()
            controller.show(3500)
        }
        video.setOnCompletionListener { updatePause() }
    }

    private fun control(label: String, action: () -> Unit) = TextView(this).apply {
        text = label
        textSize = 14f
        gravity = Gravity.CENTER
        setTextColor(Color.WHITE)
        setOnClickListener { action() }
    }

    private fun updatePause() { pauseButton.text = if (video.isPlaying) "Ⅱ" else "▶" }

    private fun cycleSpeed() {
        speed = when (speed) { 1.0f -> 1.25f; 1.25f -> 1.5f; 1.5f -> 2.0f; else -> 1.0f }
        speedButton.text = "${speed}×"
        applySpeed()
    }

    private fun applySpeed() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
            preparedPlayer?.let { player -> runCatching {
                val params = player.playbackParams
                params.setSpeed(speed)
                player.playbackParams = params
            } }
        }
    }

    private fun hideSystemBars() {
        WindowInsetsControllerCompat(window, window.decorView).apply {
            hide(WindowInsetsCompat.Type.systemBars())
            systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
        }
    }

    override fun onWindowFocusChanged(hasFocus: Boolean) {
        super.onWindowFocusChanged(hasFocus)
        if (hasFocus) hideSystemBars()
    }

    override fun onDestroy() {
        preparedPlayer = null
        video.stopPlayback()
        window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
        super.onDestroy()
    }
}
''')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if '.FullscreenVideoActivity' not in m:
              marker = '        <service\n'
              activity_line = '        <activity android:name=".FullscreenVideoActivity" android:exported="false" android:screenOrientation="unspecified" />\n'
              if marker not in m:
                  raise SystemExit('manifest marker not found')
              manifest.write_text(m.replace(marker, activity_line + marker, 1))
          PY

      - name: Commit fullscreen fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/surafel/audio/MainActivity.kt app/src/main/java/com/surafel/audio/FullscreenVideoActivity.kt app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix true fullscreen video playback"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
