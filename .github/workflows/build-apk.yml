name: Build Audio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and validate Hidden Vault source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_vault_source.py
          grep -q 'name.contains("\\\\")' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun previewPhoto(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun startRestore(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun deletePrivateFile(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'const val PREFS' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'const val CATEGORY_PHOTO' app/src/main/java/com/surafel/audio/VaultActivity.kt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/VaultActivity.kt
            git commit -m "fix Hidden Vault source before APK build [skip ci]"
            git push origin HEAD:main
          fi

      - name: Repair and validate side drawer and tool pages
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_side_drawer.py
          python3 tools/fix_tool_pages.py
          python3 - <<'PY'
          from pathlib import Path

          eq_path = Path("app/src/main/java/com/surafel/audio/EqualizerActivity.kt")
          eq = eq_path.read_text(encoding="utf-8")
          required_equalizer = [
              'class EqualizerActivity : AudioToolPageActivity()',
              'class HudFrameDrawable',
              'class BandSliderView',
              'class KnobView',
              'private fun nearestRealBand(frequencyHz: Int)',
              'private fun applyPreset(name: String)',
              'private fun cycleReverb()',
              'private fun resetEnhancers()',
          ]
          for needle in required_equalizer:
              if needle not in eq:
                  raise SystemExit(f"Equalizer implementation is incomplete: {needle}")
          if 'TODO' in eq:
              raise SystemExit("Unfinished Equalizer source")

          main = Path("app/src/main/java/com/surafel/audio/MainActivity.kt").read_text(encoding="utf-8")
          app = Path("app/src/main/java/com/surafel/audio/AudioApplication.kt").read_text(encoding="utf-8")
          manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          page_files = {
              "ThemesActivity": Path("app/src/main/java/com/surafel/audio/ThemesActivity.kt"),
              "EqualizerActivity": eq_path,
              "DriveModeActivity": Path("app/src/main/java/com/surafel/audio/DriveModeActivity.kt"),
              "AudioToolPageActivity": Path("app/src/main/java/com/surafel/audio/AudioToolPageActivity.kt"),
          }

          start = main.find("    private fun showMenu() {")
          end = main.find("    private fun showEqualizer() {")
          if start < 0 or end <= start:
              raise SystemExit("Unable to isolate showMenu()")
          menu = main[start:end]
          required = [
              'content.findViewWithTag<View>("audio_side_drawer")',
              'FrameLayout.LayoutParams(dp(326)',
              'ViewGroup.LayoutParams.MATCH_PARENT',
              'addMenuItem("☷", "Themes")',
              'addMenuItem("▦", "Widgets")',
              'addMenuItem("≋", "Equalizer")',
              'addMenuItem("◉", "Volume Booster")',
              'addMenuItem("◷", "Sleep Timer")',
              'addMenuItem("🚗", "Drive Mode")',
              'addMenuItem("⚙", "Settings")',
          ]
          for needle in required:
              if needle not in menu:
                  raise SystemExit(f"Missing side drawer implementation: {needle}")
          for forbidden in ('"Refresh Library"', '"Play Queue"', '"Search"'):
              if forbidden in menu:
                  raise SystemExit(f"Forbidden side drawer item remains: {forbidden}")
          if 'Dialog(this, R.style.Theme_Audio_SideDrawer)' in menu:
              raise SystemExit("Legacy side drawer dialog construction remains")
          if 'selected = true' in menu:
              raise SystemExit("A drawer item is permanently selected")
          if 'SideMenuInstaller' in app or 'SideMenuInstaller.install(activity)' in app:
              raise SystemExit("Legacy application-level side drawer override remains")

          hooks = {
              'ThemesActivity::class.java': 'addMenuItem("☷", "Themes")',
              'EqualizerActivity::class.java': 'addMenuItem("≋", "Equalizer")',
              'DriveModeActivity::class.java': 'addMenuItem("🚗", "Drive Mode")',
          }
          for target, marker in hooks.items():
              if target not in menu:
                  raise SystemExit(f"Drawer does not launch dedicated {target}")

          for name, path in page_files.items():
              if not path.is_file():
                  raise SystemExit(f"Missing dedicated page source: {path}")
              source = path.read_text(encoding="utf-8")
              if name != "AudioToolPageActivity" and 'class ' + name not in source:
                  raise SystemExit(f"Invalid dedicated page declaration: {name}")
              if name != "AudioToolPageActivity" and 'AudioToolPageActivity()' not in source:
                  raise SystemExit(f"Dedicated page does not use shared shell: {name}")
              if 'TODO' in source:
                  raise SystemExit(f"Unfinished tool page source: {name}")

          for activity in (".ThemesActivity", ".EqualizerActivity", ".DriveModeActivity"):
              if f'android:name="{activity}"' not in manifest:
                  raise SystemExit(f"Missing manifest registration: {activity}")

          if 'startActivity(Intent(this, WidgetCatalogActivity::class.java))' not in main:
              raise SystemExit("Widgets page hook was lost")
          if 'applyTheme(prefs.getInt("theme", 0))' not in main:
              raise SystemExit("MainActivity does not restore the selected theme")
          print("Dedicated Themes, Equalizer and Drive Mode validation passed")
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/MainActivity.kt app/src/main/java/com/surafel/audio/EqualizerActivity.kt
            git commit -m "fix: repair dedicated tool page sources before APK build [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate project source
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            app/src/main/java/com/surafel/audio/MainActivity.kt \
            app/src/main/java/com/surafel/audio/WidgetCatalogActivity.kt \
            app/src/main/java/com/surafel/audio/AudioWidgetProviders.kt \
            app/src/main/java/com/surafel/audio/FullscreenVideoActivity.kt \
            app/src/main/java/com/surafel/audio/PlaybackService.kt \
            app/src/main/java/com/surafel/audio/VaultActivity.kt \
            app/src/main/java/com/surafel/audio/AudioToolPageActivity.kt \
            app/src/main/java/com/surafel/audio/ThemesActivity.kt \
            app/src/main/java/com/surafel/audio/EqualizerActivity.kt \
            app/src/main/java/com/surafel/audio/DriveModeActivity.kt; do
            test -f "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          if 'versionCode = 319' not in gradle or 'versionName = "1.0.319"' not in gradle:
              raise SystemExit("Expected Audio version 1.0.319 is missing")
          styles = Path("app/src/main/res/values/styles.xml").read_text(encoding="utf-8")
          if 'Theme.Audio.SideDrawer' not in styles:
              raise SystemExit("Side drawer style declaration is missing")
          print("Project source validation passed")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clean build outputs
        run: gradle clean --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --rerun-tasks --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='319'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='1.0.319'"
          ls -lh "$APK"

      - name: Copy APK with build identity
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}-v319.apk"
          test -s "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}-v319.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-debug-apk-${{ github.run_number }}-v319
          path: app/build/outputs/apk/debug/Audio-debug-${{ github.run_number }}-v319.apk
          if-no-files-found: error
