name: Build Audio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply true fullscreen video player fix
        run: python3 scripts/patch_fullscreen_video.py
      - name: Commit fullscreen fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/surafel/audio/MainActivity.kt app/src/main/java/com/surafel/audio/FullscreenVideoActivity.kt app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix true fullscreen video playback"
          git push
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
