name: Build Audio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Vault UI refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/refine_vault.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/VaultActivity.kt
            git commit -m "refine Hidden Vault luxury UI [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Kotlin source structure
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/surafel/audio/MainActivity.kt
          test -f app/src/main/java/com/surafel/audio/FullscreenVideoActivity.kt
          test -f app/src/main/java/com/surafel/audio/PlaybackService.kt
          test -f app/src/main/java/com/surafel/audio/VaultActivity.kt
          if grep -RInE 'fullscreenVideo|exitFullscreenVideo|enterFullscreenVideo' app/src/main/java/com/surafel/audio; then
            echo 'Stale fullscreen implementation references found.'
            exit 1
          fi

      - name: Compile and build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Give APK a unique filename
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}.apk"
          test -s "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}.apk"
          ls -lh "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/Audio-debug-${{ github.run_number }}.apk
          if-no-files-found: error
