name: Build Audio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and validate Hidden Vault source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_vault_source.py
          grep -q 'name.contains("\\\\")' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun previewPhoto(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun startRestore(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun deletePrivateFile(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'const val PREFS' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'const val CATEGORY_PHOTO' app/src/main/java/com/surafel/audio/VaultActivity.kt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/VaultActivity.kt
            git commit -m "fix Hidden Vault source before APK build [skip ci]"
            git push origin HEAD:main
          fi

      - name: Repair and validate side drawer and Widgets page
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_side_drawer.py
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/com/surafel/audio/MainActivity.kt").read_text(encoding="utf-8")
          app = Path("app/src/main/java/com/surafel/audio/AudioApplication.kt").read_text(encoding="utf-8")
          widget_page = Path("app/src/main/java/com/surafel/audio/WidgetCatalogActivity.kt").read_text(encoding="utf-8")
          widget_providers = Path("app/src/main/java/com/surafel/audio/AudioWidgetProviders.kt").read_text(encoding="utf-8")
          manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")

          start = main.find("    private fun showMenu() {")
          end = main.find("    private fun showEqualizer() {")
          if start < 0 or end <= start:
              raise SystemExit("Unable to isolate showMenu() for validation")
          menu = main[start:end]

          required = [
              'import android.widget.FrameLayout',
              'tag = "audio_side_drawer"',
              'content.findViewWithTag<View>("audio_side_drawer")',
              'FrameLayout.LayoutParams(',
              'dp(326),',
              'ViewGroup.LayoutParams.MATCH_PARENT',
              'content.addView(overlay, ViewGroup.LayoutParams(',
              'addMenuItem("☷", "Themes")',
              'addMenuItem("▦", "Widgets")',
              'addMenuItem("≋", "Equalizer")',
              'addMenuItem("◷", "Sleep Timer")',
              'addMenuItem("🚗", "Drive Mode")',
              'addMenuItem("⚙", "Settings")',
          ]
          for needle in required:
              haystack = main if needle.startswith('import ') else menu
              if needle not in haystack:
                  raise SystemExit(f"Missing side drawer implementation: {needle}")

          for forbidden in ('"Refresh Library"', '"Play Queue"', '"Search"'):
              if forbidden in menu:
                  raise SystemExit(f"Forbidden side drawer item remains: {forbidden}")

          if 'Dialog(this, R.style.Theme_Audio_SideDrawer)' in menu:
              raise SystemExit("Legacy Dialog side drawer construction remains")

          if 'SideMenuInstaller' in app:
              raise SystemExit("Duplicate legacy SideMenuInstaller still exists in AudioApplication")

          if 'SideMenuInstaller.install(activity)' in app:
              raise SystemExit("Application lifecycle still overrides MainActivity side drawer")

          if 'findViewById<TextView>(R.id.menuButton)?.setOnClickListener' in app:
              raise SystemExit("Application-level menuButton listener override detected")

          widgets_start = main.find("    private fun showWidgets() {")
          widgets_end = main.find("    private fun showPremiumInfo() {")
          if widgets_start < 0 or widgets_end <= widgets_start:
              raise SystemExit("Unable to locate showWidgets()")
          widgets = main[widgets_start:widgets_end]
          if 'startActivity(Intent(this, WidgetCatalogActivity::class.java))' not in widgets:
              raise SystemExit("Widgets menu does not launch the dedicated WidgetCatalogActivity")
          if 'AlertDialog.Builder' in widgets:
              raise SystemExit("Legacy Widgets AlertDialog remains")

          for name in (
              'Practical', 'Feature-Rich', 'Standard', 'Stylish',
              'Classic', 'Lite', 'Simple', 'Mini'
          ):
              if f'WidgetStyle("{name}"' not in widget_page:
                  raise SystemExit(f"Missing widget catalog style: {name}")

          for provider in (
              'AudioWidgetPracticalProvider', 'AudioWidgetFeatureRichProvider',
              'AudioWidgetStandardProvider', 'AudioWidgetStylishProvider',
              'AudioWidgetClassicProvider', 'AudioWidgetLiteProvider',
              'AudioWidgetSimpleProvider', 'AudioWidgetMiniProvider'
          ):
              if provider not in widget_providers:
                  raise SystemExit(f"Missing real widget provider: {provider}")

          if 'android:name=".WidgetCatalogActivity"' not in manifest:
              raise SystemExit("WidgetCatalogActivity is missing from AndroidManifest")

          print("Single side drawer owner + dedicated Widgets page validation passed")
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/MainActivity.kt
            git commit -m "fix: use full-height in-activity side drawer and real Widgets page [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate project source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/surafel/audio/MainActivity.kt
          test -f app/src/main/java/com/surafel/audio/WidgetCatalogActivity.kt
          test -f app/src/main/java/com/surafel/audio/AudioWidgetProviders.kt
          test -f app/src/main/java/com/surafel/audio/FullscreenVideoActivity.kt
          test -f app/src/main/java/com/surafel/audio/PlaybackService.kt
          test -f app/src/main/java/com/surafel/audio/VaultActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          if 'versionCode = 319' not in gradle or 'versionName = "1.0.319"' not in gradle:
              raise SystemExit("Expected Audio version 1.0.319 is missing")
          styles = Path("app/src/main/res/values/styles.xml").read_text(encoding="utf-8")
          if 'Theme.Audio.SideDrawer' not in styles:
              raise SystemExit("Side drawer style declaration is missing")
          print("Project source validation passed")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clean build outputs
        run: gradle clean --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --rerun-tasks --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='319'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='1.0.319'"
          ls -lh "$APK"

      - name: Copy APK with build identity
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}-v319.apk"
          test -s "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}-v319.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-debug-apk-${{ github.run_number }}-v319
          path: app/build/outputs/apk/debug/Audio-debug-${{ github.run_number }}-v319.apk
          if-no-files-found: error
