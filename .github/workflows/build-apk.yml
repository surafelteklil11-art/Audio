name: Build Audio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and validate Hidden Vault source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_vault_source.py
          grep -q 'name.contains("\\\\")' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun previewPhoto(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun startRestore(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'private fun deletePrivateFile(file: File)' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'const val PREFS' app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'const val CATEGORY_PHOTO' app/src/main/java/com/surafel/audio/VaultActivity.kt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/VaultActivity.kt
            git commit -m "fix Hidden Vault source before APK build [skip ci]"
            git push origin HEAD:main
          fi

      - name: Repair and validate side drawer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_side_drawer.py
          grep -q 'import android.app.Dialog' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'import androidx.core.view.WindowCompat' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'val dialog = Dialog(this, R.style.Theme_Audio_SideDrawer).apply { setContentView(panel) }' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'WindowCompat.setDecorFitsSystemWindows(window, false)' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'window.setLayout(dp(326), WindowManager.LayoutParams.MATCH_PARENT)' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'addMenuItem("☷", "Themes")' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'addMenuItem("▦", "Widgets")' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'addMenuItem("≋", "Equalizer")' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'addMenuItem("◷", "Sleep Timer")' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'addMenuItem("🚗", "Drive Mode")' app/src/main/java/com/surafel/audio/MainActivity.kt
          grep -q 'addMenuItem("⚙", "Settings")' app/src/main/java/com/surafel/audio/MainActivity.kt
          MENU="$(sed -n '/private fun showMenu()/,/private fun showEqualizer()/p' app/src/main/java/com/surafel/audio/MainActivity.kt)"
          if printf '%s\n' "$MENU" | grep -q '"Refresh Library"'; then exit 1; fi
          if printf '%s\n' "$MENU" | grep -q '"Play Queue"'; then exit 1; fi
          if printf '%s\n' "$MENU" | grep -q '"Search"'; then exit 1; fi
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/MainActivity.kt
            git commit -m "fix: use true full-height side drawer dialog [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate project source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/surafel/audio/MainActivity.kt
          test -f app/src/main/java/com/surafel/audio/FullscreenVideoActivity.kt
          test -f app/src/main/java/com/surafel/audio/PlaybackService.kt
          test -f app/src/main/java/com/surafel/audio/VaultActivity.kt
          grep -q 'versionCode = 318' app/build.gradle.kts
          grep -q 'versionName = "1.0.318"' app/build.gradle.kts
          grep -q 'Theme_Audio_SideDrawer' app/src/main/res/values/styles.xml
          if grep -RInE 'fullscreenVideo|exitFullscreenVideo|enterFullscreenVideo' app/src/main/java/com/surafel/audio; then
            echo 'Stale fullscreen implementation references found.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clean build outputs
        run: gradle clean --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --rerun-tasks --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='318'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='1.0.318'"
          ls -lh "$APK"

      - name: Copy APK with build identity
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}-v318.apk"
          test -s "app/build/outputs/apk/debug/Audio-debug-${GITHUB_RUN_NUMBER}-v318.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-debug-apk-${{ github.run_number }}-v318
          path: app/build/outputs/apk/debug/Audio-debug-${{ github.run_number }}-v318.apk
          if-no-files-found: error
