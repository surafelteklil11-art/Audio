name: Generate Android launcher icons

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/res/drawable/ic_launcher_art.svg"
      - ".github/workflows/generate-launcher-icons.yml"
      - "tools/generate_launcher_icons.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow cairosvg
      - run: python tools/generate_launcher_icons.py
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/mipmap-*/ic_launcher.png
          git diff --cached --quiet || git commit -m "Generate sci-fi launcher PNG icons"
          git push
