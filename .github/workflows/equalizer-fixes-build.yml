name: Equalizer fixes and build

on:
  push:
    paths:
      - "tools/trigger-equalizer-fix.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equalizer-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply Equalizer fixes to the actual source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_equalizer_ui.py
          grep -q 'private var selectedPreset = "CUSTOM"' app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          grep -q 'private fun resetBands()' app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          grep -q 'private fun showReverbChooser()' app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          grep -q 'setBackgroundColor(Color.TRANSPARENT)' app/src/main/java/com/surafel/audio/EqualizerActivity.kt

      - name: Commit the source changes
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/EqualizerActivity.kt
            git commit -m "fix: complete Equalizer UI, reverb and custom state"
            git push origin HEAD:main
          fi

      - name: Build debug APK from the patched source
        run: |
          gradle clean --no-daemon
          gradle assembleDebug --no-daemon --rerun-tasks --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='319'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='1.0.319'"
          cp "$APK" "app/build/outputs/apk/debug/Audio-equalizer-fix-${GITHUB_RUN_NUMBER}-v319.apk"
          ls -lh "app/build/outputs/apk/debug/Audio-equalizer-fix-${GITHUB_RUN_NUMBER}-v319.apk"

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-equalizer-fix-${{ github.run_number }}-v319
          path: app/build/outputs/apk/debug/Audio-equalizer-fix-${{ github.run_number }}-v319.apk
          if-no-files-found: error
