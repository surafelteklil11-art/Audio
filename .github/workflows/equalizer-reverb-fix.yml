name: Equalizer reverb fix and build

on:
  push:
    paths:
      - "tools/trigger-reverb-fix.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fix reverb choices
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/surafel/audio/EqualizerActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = 'private val reverbNames = arrayOf("NONE", "SMALL ROOM", "MEDIUM ROOM", "LARGE ROOM", "MEDIUM HALL", "LARGE HALL")'
          new = 'private val reverbNames = arrayOf("NONE", "SMALL ROOM", "MEDIUM ROOM", "BIG ROOM", "CONCERT HALL", "ARENA", "STUDIO VOCAL")'
          if old not in s: raise SystemExit('reverb names anchor missing')
          s = s.replace(old, new, 1)
          old = 'private val reverbPresets = shortArrayOf(PresetReverb.PRESET_NONE, PresetReverb.PRESET_SMALLROOM, PresetReverb.PRESET_MEDIUMROOM, PresetReverb.PRESET_LARGEROOM, PresetReverb.PRESET_MEDIUMHALL, PresetReverb.PRESET_LARGEHALL)'
          new = 'private val reverbPresets = shortArrayOf(PresetReverb.PRESET_NONE, PresetReverb.PRESET_SMALLROOM, PresetReverb.PRESET_MEDIUMROOM, PresetReverb.PRESET_LARGEROOM, PresetReverb.PRESET_MEDIUMHALL, PresetReverb.PRESET_LARGEHALL, PresetReverb.PRESET_LARGEHALL)'
          if old not in s: raise SystemExit('reverb presets anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('var pending = reverbIndex.coerceIn(0, 5)', 'var pending = reverbIndex.coerceIn(0, reverbNames.lastIndex)', 1)
          s = s.replace('val safe = index.coerceIn(0, 5)', 'val safe = index.coerceIn(0, reverbNames.lastIndex)', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'STUDIO VOCAL' app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          grep -q 'reverbNames.lastIndex' app/src/main/java/com/surafel/audio/EqualizerActivity.kt
      - name: Commit source fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/EqualizerActivity.kt
            git commit -m "fix: complete reverb choices"
            git push origin HEAD:main
          fi
      - name: Build APK
        run: |
          gradle clean --no-daemon
          gradle assembleDebug --no-daemon --rerun-tasks --stacktrace
      - name: Verify and upload
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='319'"
          cp "$APK" "app/build/outputs/apk/debug/Audio-reverb-fix-${GITHUB_RUN_NUMBER}-v319.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-reverb-fix-${{ github.run_number }}-v319
          path: app/build/outputs/apk/debug/Audio-reverb-fix-${{ github.run_number }}-v319.apk
          if-no-files-found: error
