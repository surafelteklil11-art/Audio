name: Equalizer reverb fix and build

on:
  push:
    paths:
      - "tools/trigger-reverb-fix.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fix preset layout and redesign reverb chooser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/surafel/audio/EqualizerActivity.kt')
          s = p.read_text(encoding='utf-8')

          # Keep the final four presets in the requested 2-column arrangement:
          # Folk / Electronic on row 1, Podcast / Heavy Metal directly below.
          s = s.replace(
              '"BLUES", "SOFT", "LATIN", "VOCAL", "GOSPEL", "BRIGHT", "FOLK", "ELECTRONIC", "PODCAST", "HEAVY_METAL"',
              '"BLUES", "SOFT", "LATIN", "VOCAL", "GOSPEL", "BRIGHT", "FOLK", "ELECTRONIC", "PODCAST", "HEAVY_METAL"',
              1
          )

          old = '''pageNames.chunked(3).forEach { rowNames ->
                val row = LinearLayout(this@EqualizerActivity).apply {
                    orientation = LinearLayout.HORIZONTAL
                    gravity = Gravity.CENTER_VERTICAL
                }
                rowNames.forEach { name ->
                    row.addView(presetButton(name), LinearLayout.LayoutParams(cardWidth, cardHeight).apply {
                        rightMargin = gap
                        bottomMargin = gap
                    })
                }
                while (row.childCount < 3) {
                    row.addView(View(this@EqualizerActivity), LinearLayout.LayoutParams(cardWidth, cardHeight).apply { rightMargin = gap })
                }
                page.addView(row, LinearLayout.LayoutParams(pageWidth, cardHeight + gap))
            }'''
          new = '''val rows = if (pageNames.size == 4) {
                listOf(listOf(pageNames[0], pageNames[1], ""), listOf(pageNames[2], pageNames[3], ""))
            } else {
                pageNames.chunked(3)
            }
            rows.forEach { rowNames ->
                val row = LinearLayout(this@EqualizerActivity).apply {
                    orientation = LinearLayout.HORIZONTAL
                    gravity = Gravity.CENTER_VERTICAL
                }
                rowNames.forEach { name ->
                    if (name.isNotEmpty()) {
                        row.addView(presetButton(name), LinearLayout.LayoutParams(cardWidth, cardHeight).apply {
                            rightMargin = gap
                            bottomMargin = gap
                        })
                    } else {
                        row.addView(View(this@EqualizerActivity), LinearLayout.LayoutParams(cardWidth, cardHeight).apply {
                            rightMargin = gap
                            bottomMargin = gap
                        })
                    }
                }
                page.addView(row, LinearLayout.LayoutParams(pageWidth, cardHeight + gap))
            }'''
          if old not in s:
              raise SystemExit('preset row anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('pages.addView(page, LinearLayout.LayoutParams(pageWidth, dp(92)))', 'pages.addView(page, LinearLayout.LayoutParams(pageWidth, dp(92)))', 1)

          # Replace the old large translucent AlertDialog with a compact, opaque
          # bottom-sheet style chooser that is easier to read and touch.
          start = s.find('    private fun showReverbChooser()')
          if start < 0:
              raise SystemExit('showReverbChooser anchor missing')
          end_match = re.search(r'\n    private fun ', s[start + 10:])
          if not end_match:
              raise SystemExit('next function after showReverbChooser not found')
          end = start + 10 + end_match.start()

          new_function = r'''    private fun showReverbChooser() {
        var pending = reverbIndex.coerceIn(0, reverbNames.lastIndex)
        val dialog = AlertDialog.Builder(this).create()

        val panel = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(20), dp(18), dp(20), dp(12))
            background = rounded(Color.rgb(15, 31, 57), Color.rgb(44, 65, 96), dp(1), dp(22).toFloat())
        }

        val header = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER_VERTICAL
        }
        header.addView(TextView(this@EqualizerActivity).apply {
            text = "Choose Reverb"
            textSize = 21f
            setTypeface(typeface, Typeface.BOLD)
            setTextColor(Color.rgb(242, 245, 250))
        }, LinearLayout.LayoutParams(0, dp(48), 1f))
        header.addView(TextView(this@EqualizerActivity).apply {
            text = "Apply"
            textSize = 15f
            setTypeface(typeface, Typeface.BOLD)
            setTextColor(Color.rgb(245, 25, 157))
            gravity = Gravity.CENTER
            setPadding(dp(10), 0, dp(4), 0)
            setOnClickListener {
                reverbIndex = pending
                applyReverb(reverbIndex)
                reverbValue.text = "${reverbDisplayName(reverbIndex)}   ›"
                dialog.dismiss()
            }
        }, LinearLayout.LayoutParams(dp(72), dp(48)))
        panel.addView(header)

        val list = ScrollView(this).apply {
            overScrollMode = View.OVER_SCROLL_NEVER
        }
        val choices = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
        }
        val descriptions = arrayOf(
            "No added ambience.",
            "Light echo for everyday listening.",
            "Add natural depth and balanced space.",
            "Create a wider, more immersive feel.",
            "Bring the atmosphere of a live concert.",
            "Adds depth and a grand sense of space.",
            "Make vocals clearer and more present."
        )
        reverbNames.forEachIndexed { index, name ->
            val row = LinearLayout(this@EqualizerActivity).apply {
                orientation = LinearLayout.HORIZONTAL
                gravity = Gravity.CENTER_VERTICAL
                setPadding(0, dp(3), 0, dp(3))
                isClickable = true
                setOnClickListener { pending = index; refreshReverbChoices(choices, pending) }
            }
            val radio = TextView(this@EqualizerActivity).apply {
                text = if (index == pending) "◉" else "○"
                textSize = 27f
                gravity = Gravity.CENTER
                setTextColor(if (index == pending) Color.rgb(245, 25, 157) else Color.rgb(205, 213, 226))
                tag = "radio_$index"
            }
            row.addView(radio, LinearLayout.LayoutParams(dp(52), dp(58)))
            row.addView(TextView(this@EqualizerActivity).apply {
                text = reverbDisplayName(index) + "\n" + descriptions[index]
                textSize = 15f
                setTextColor(Color.rgb(239, 243, 249))
                setLineSpacing(0f, 1.05f)
            }, LinearLayout.LayoutParams(0, dp(58), 1f))
            choices.addView(row)
        }
        list.addView(choices, ViewGroup.LayoutParams(-1, -2))
        panel.addView(list, LinearLayout.LayoutParams(-1, dp(390)).apply { topMargin = dp(4) })

        val cancel = TextView(this).apply {
            text = "Cancel"
            textSize = 14f
            gravity = Gravity.CENTER
            setTextColor(Color.rgb(154, 166, 190))
            setPadding(0, dp(6), 0, 0)
            setOnClickListener { dialog.dismiss() }
        }
        panel.addView(cancel, LinearLayout.LayoutParams(-1, dp(38)))

        dialog.setView(panel)
        dialog.setOnShowListener {
            dialog.window?.setBackgroundDrawableResource(android.R.color.transparent)
            dialog.window?.setLayout(-1, dp(470))
            dialog.window?.setGravity(Gravity.BOTTOM)
            dialog.window?.attributes = dialog.window?.attributes?.apply {
                width = -1
                height = dp(470)
                dimAmount = 0.62f
            }
            dialog.window?.addFlags(android.view.WindowManager.LayoutParams.FLAG_DIM_BEHIND)
        }
        dialog.show()
        dialog.window?.setLayout(-1, dp(470))
        dialog.window?.setGravity(Gravity.BOTTOM)
        dialog.window?.attributes = dialog.window?.attributes?.apply {
            width = -1
            height = dp(470)
            dimAmount = 0.62f
        }
    }

    private fun refreshReverbChoices(container: LinearLayout, selected: Int) {
        for (i in 0 until container.childCount) {
            val row = container.getChildAt(i) as? LinearLayout ?: continue
            val radio = row.getChildAt(0) as? TextView ?: continue
            radio.text = if (i == selected) "◉" else "○"
            radio.setTextColor(if (i == selected) Color.rgb(245, 25, 157) else Color.rgb(205, 213, 226))
        }
    }
'''
          s = s[:start] + new_function + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'Choose Reverb' app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          grep -q 'if (pageNames.size == 4)' app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          grep -q 'refreshReverbChoices' app/src/main/java/com/surafel/audio/EqualizerActivity.kt

      - name: Commit source fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/EqualizerActivity.kt
            git commit -m "fix: align final presets and redesign reverb chooser"
            git push origin HEAD:main
          fi

      - name: Build APK
        run: |
          gradle clean --no-daemon
          gradle assembleDebug --no-daemon --rerun-tasks --stacktrace

      - name: Verify and upload
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='319'"
          cp "$APK" "app/build/outputs/apk/debug/Audio-reverb-fix-${GITHUB_RUN_NUMBER}-v319.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Audio-reverb-fix-${{ github.run_number }}-v319
          path: app/build/outputs/apk/debug/Audio-reverb-fix-${{ github.run_number }}-v319.apk
          if-no-files-found: error
