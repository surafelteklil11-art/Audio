name: Equalizer reverb fix and build

on:
  push:
    paths:
      - "tools/trigger-reverb-fix.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply UI patch
        run: python3 tools/fix_reverb_ui.py
      - name: Commit source fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/surafel/audio/EqualizerActivity.kt
            git commit -m "fix: align final presets and redesign reverb chooser"
            git push origin HEAD:main
          fi
      - name: Build APK
        run: |
          gradle clean --no-daemon
          gradle assembleDebug --no-daemon --rerun-tasks --stacktrace
      - name: Verify and upload
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='319'"
          cp "$APK" "app/build/outputs/apk/debug/Audio-reverb-fix-${GITHUB_RUN_NUMBER}-v319.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-reverb-fix-${{ github.run_number }}-v319
          path: app/build/outputs/apk/debug/Audio-reverb-fix-${{ github.run_number }}-v319.apk
          if-no-files-found: error
