name: One-time Hidden Vault refinement

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  actions: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Hidden Vault refinement
        run: python3 tools/refine_vault_v2.py

      - name: Commit source changes and remove one-time tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f tools/refine_vault_v2.py tools/.vault_refine_probe.txt .github/workflows/refine-vault.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/surafel/audio/VaultActivity.kt app/src/main/java/com/surafel/audio/MainActivity.kt tools/refine_vault_v2.py tools/.vault_refine_probe.txt .github/workflows/refine-vault.yml
          if git diff --cached --quiet; then
            echo "No refinement changes were needed."
            exit 0
          fi
          git commit -m "Refine Hidden Vault UI and weekly report"
          git push origin HEAD:main

      - name: Dispatch APK build for refined source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
