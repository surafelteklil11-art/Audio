name: Final Equalizer UI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Equalizer responsive UI fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/surafel/audio/EqualizerActivity.kt")
          s = p.read_text(encoding="utf-8")
          original = s

          # Header: smaller title/switch and exactly the same dark-blue surface as the page.
          s = s.replace('root.addView(buildHeader(), LinearLayout.LayoutParams(-1, dp(68)))',
                        'root.addView(buildHeader(), LinearLayout.LayoutParams(-1, dp(60)))')
          s = s.replace('setBackgroundColor(Color.TRANSPARENT)\n\n        addView(TextView(this@EqualizerActivity).apply {\n            text = "←"',
                        'setBackgroundColor(Color.rgb(7, 20, 45))\n\n        addView(TextView(this@EqualizerActivity).apply {\n            text = "←"')
          s = s.replace('textSize = 28f', 'textSize = 24f', 1)
          s = s.replace('LinearLayout.LayoutParams(dp(44), -1)', 'LinearLayout.LayoutParams(dp(38), -1)', 1)
          s = s.replace('textSize = 20f', 'textSize = 18f', 1)
          s = s.replace('LinearLayout.LayoutParams(dp(60), dp(38))', 'LinearLayout.LayoutParams(dp(52), dp(32))', 1)

          # Presets: keep the 3x2 grid, but give the whole section enough height so
          # the second row is never covered by the Equalizer card.
          s = s.replace('content.addView(buildPresetSection(), LinearLayout.LayoutParams(-1, dp(146)))',
                        'content.addView(buildPresetSection(), LinearLayout.LayoutParams(-1, dp(178)))')
          s = s.replace('val cardHeight = dp(44)', 'val cardHeight = dp(40)')
          s = s.replace('pages.addView(page, LinearLayout.LayoutParams(pageWidth, dp(100)))',
                        'pages.addView(page, LinearLayout.LayoutParams(pageWidth, dp(92)))')
          s = s.replace('horizontal.addView(pages, ViewGroup.LayoutParams(-2, dp(100)))',
                        'horizontal.addView(pages, ViewGroup.LayoutParams(-2, dp(92)))')
          s = s.replace('addView(horizontal, LinearLayout.LayoutParams(-1, dp(100)))',
                        'addView(horizontal, LinearLayout.LayoutParams(-1, dp(92)))')

          # 10-band: reduce horizontal footprint of every track/thumb/label so ten
          # bands have visible breathing room instead of touching each other.
          s = s.replace('val trackW = dp(if (tenBand) 7 else 9).toFloat()',
                        'val trackW = dp(if (tenBand) 5 else 8).toFloat()')
          s = s.replace('val thumbW = dp(if (tenBand) 24 else 32).toFloat()',
                        'val thumbW = dp(if (tenBand) 20 else 30).toFloat()')
          s = s.replace('val thumbH = dp(if (tenBand) 19 else 23).toFloat()',
                        'val thumbH = dp(if (tenBand) 17 else 22).toFloat()')
          s = s.replace('paint.textSize = dp(if (tenBand) 8 else 10).toFloat()',
                        'paint.textSize = dp(if (tenBand) 7 else 9).toFloat()')
          s = s.replace('paint.textSize = dp(if (tenBand) 6 else 8).toFloat()',
                        'paint.textSize = dp(if (tenBand) 6 else 8).toFloat()')

          # Make the band columns use all available width with no extra side margins.
          s = s.replace('leftMargin = dp(1)\n                rightMargin = dp(1)',
                        'leftMargin = 0\n                rightMargin = 0')

          if s == original:
              raise SystemExit("No Equalizer source changes were applied")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit patched Equalizer source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: compact Equalizer header presets and 10-band spacing [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon --rerun-tasks --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-final-equalizer-ui-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
