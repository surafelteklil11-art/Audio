name: Final Equalizer UI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Equalizer presets viewport fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/surafel/audio/EqualizerActivity.kt")
          s = p.read_text(encoding="utf-8")
          original = s

          # Replace only the Presets layout. Keep all Equalizer, Reverb,
          # Enhancer, ON/OFF and Custom-state behavior untouched.
          start = s.index('    private fun buildPresetSection(): View =')
          end = s.index('    private fun presetButton(name: String): UiButton {', start)

          new_function = '''    private fun buildPresetSection(): View = LinearLayout(this).apply {
          orientation = LinearLayout.VERTICAL
          setBackgroundColor(Color.TRANSPARENT)

          val titleRow = LinearLayout(this@EqualizerActivity).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
          }
          titleRow.addView(TextView(this@EqualizerActivity).apply {
              text = "Presets"
              textSize = 22f
              includeFontPadding = false
              gravity = Gravity.CENTER_VERTICAL
              setTextColor(Color.rgb(238, 242, 250))
          }, LinearLayout.LayoutParams(0, dp(38), 1f))
          titleRow.addView(TextView(this@EqualizerActivity).apply {
              text = "More   ›"
              textSize = 16f
              includeFontPadding = false
              gravity = Gravity.CENTER
              setTextColor(Color.rgb(170, 181, 201))
              setOnClickListener { Toast.makeText(this@EqualizerActivity, "Swipe left/right for more presets", Toast.LENGTH_SHORT).show() }
          }, LinearLayout.LayoutParams(dp(94), dp(38)))
          addView(titleRow, LinearLayout.LayoutParams(-1, dp(40)))

          val horizontal = HorizontalScrollView(this@EqualizerActivity).apply {
              isHorizontalScrollBarEnabled = false
              overScrollMode = View.OVER_SCROLL_NEVER
              isFillViewport = false
              clipToPadding = true
              clipChildren = true
              setPadding(0, 0, 0, 0)
          }

          val pages = LinearLayout(this@EqualizerActivity).apply {
              orientation = LinearLayout.HORIZONTAL
              setPadding(0, 0, 0, 0)
              clipChildren = true
              clipToPadding = false
          }

          val gap = dp(6)
          val cardHeight = dp(40)
          val pageViews = mutableListOf<LinearLayout>()

          presetNames.chunked(6).forEach { pageNames ->
              val page = LinearLayout(this@EqualizerActivity).apply {
                  orientation = LinearLayout.VERTICAL
                  gravity = Gravity.TOP
                  setPadding(0, 0, 0, 0)
                  clipChildren = true
                  clipToPadding = false
              }
              pageViews += page

              pageNames.chunked(3).forEach { rowNames ->
                  val row = LinearLayout(this@EqualizerActivity).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 0)
                      clipChildren = true
                      clipToPadding = false
                  }
                  rowNames.forEachIndexed { index, name ->
                      row.addView(presetButton(name), LinearLayout.LayoutParams(0, cardHeight, 1f).apply {
                          rightMargin = if (index == rowNames.lastIndex) 0 else gap
                          bottomMargin = gap
                      })
                  }
                  // Fill an incomplete final row with invisible spacers so
                  // every page keeps exactly the same 3-column geometry.
                  repeat(3 - rowNames.size) {
                      row.addView(View(this@EqualizerActivity), LinearLayout.LayoutParams(0, cardHeight, 1f).apply {
                          rightMargin = if (it == 3 - rowNames.size - 1) 0 else gap
                          bottomMargin = gap
                      })
                  }
                  page.addView(row, LinearLayout.LayoutParams(-1, cardHeight + gap))
              }

              // Every page is sized later to the actual horizontal viewport.
              pages.addView(page, LinearLayout.LayoutParams(0, dp(92)))
          }

          horizontal.addView(pages, ViewGroup.LayoutParams(-2, dp(92)))
          addView(horizontal, LinearLayout.LayoutParams(-1, dp(92)))

          // Important: measure the real content viewport, not displayMetrics.
          // Then give both each page and the pages container exact widths.
          horizontal.post {
              val viewportWidth = horizontal.width
              if (viewportWidth > 0 && pageViews.isNotEmpty()) {
                  pageViews.forEach { page ->
                      page.layoutParams = LinearLayout.LayoutParams(viewportWidth, dp(92))
                  }
                  pages.layoutParams = LinearLayout.LayoutParams(viewportWidth * pageViews.size, dp(92))
                  pages.requestLayout()
                  horizontal.requestLayout()
              }
          }
      }

'''

          s = s[:start] + new_function + s[end:]

          # The section itself should contain only the title + the two preset rows;
          # remove the old extra vertical space below the grid.
          s = s.replace(
              'content.addView(buildPresetSection(), LinearLayout.LayoutParams(-1, dp(184)))',
              'content.addView(buildPresetSection(), LinearLayout.LayoutParams(-1, dp(142)))'
          )

          if s == original:
              raise SystemExit("No Presets source changes were applied")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit patched Equalizer source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/surafel/audio/EqualizerActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: make Equalizer presets pages fit viewport [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon --rerun-tasks --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-final-equalizer-ui-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
